# JYNTRA AI — GitHub Actions CI
# Runs on every push to main and on PRs targeting main.
# No production API keys required: tests use mocked providers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Run benchmarks
        run: npx tsx benchmarks/run.js
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Docker build check
        run: docker build --target builder --tag jyntra-ai:ci-check .
        if: ${{ always() }}
